[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wincage"
version = "0.1.0"
description = "Windows AppContainer + Job Object process sandbox, driven by a separate C++ helper process for crash-fault containment, plus a diagnostic capability-probe package."
readme = "README.md"
# process.py uses bare `str | None` union syntax without `from __future__
# import annotations`, which needs native PEP 604 support (3.10+).
requires-python = ">=3.10"
# Every import across wincage/ and wincage/checker/ is stdlib-only or a
# same-package relative import. Zero non-stdlib runtime dependency.
dependencies = []

# This directory is the wincage package root: wincage/ plus its nested
# wincage.checker/ subpackage. The application-specific adapter layer that
# originally wrapped it stays behind in that application's own tree.
[tool.setuptools]
packages = ["wincage", "wincage.checker"]

# Scoped to exactly the prebuilt binaries the runtime needs. Not src/* or
# checker/src/*: both src/ dirs also hold .cpp/.h sources and build_tests.sh,
# which must stay out of the wheel.
[tool.setuptools.package-data]
wincage = ["sandbox_host.exe", "scripts/*.ps1"]
"wincage.checker" = ["src/*.exe", "src/*.dll"]
